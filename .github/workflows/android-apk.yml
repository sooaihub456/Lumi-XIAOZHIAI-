name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: interactive-xiaozhi-ai-app-android-configured

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build Android APK
        run: node scripts/build-apk.mjs

      - name: Check APK exists
        run: |
          echo "APK files:"
          find artifacts -type f -maxdepth 2 -print
          test -f artifacts/mori-preview.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mori-android-apk
          path: interactive-xiaozhi-ai-app-android-configured/artifacts/mori-preview.apk
          if-no-files-found: error
          retention-days: 30
