name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: interactive-xiaozhi-ai-app-android-configured

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Verify project files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""
          test -f package.json
          test -f package-lock.json
          test -f scripts/build-apk.mjs
          test -f capacitor.config.ts
          echo "Project structure OK."

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Show Node version
        run: |
          node --version
          npm --version

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sdkmanager --list_installed

      - name: Install project dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          echo "Web build exists:"
          ls -lh dist/index.html

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: node scripts/build-apk.mjs

      - name: Verify generated APK
        run: |
          echo "Generated files:"
          find artifacts -maxdepth 2 -type f -print

          test -f artifacts/mori-preview.apk

          echo ""
          echo "APK:"
          ls -lh artifacts/mori-preview.apk

          echo ""
          cat artifacts/mori-preview.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mori-android-apk
          path: |
            interactive-xiaozhi-ai-app-android-configured/artifacts/mori-preview.apk
            interactive-xiaozhi-ai-app-android-configured/artifacts/mori-preview.apk.sha256
            interactive-xiaozhi-ai-app-android-configured/artifacts/build-info.json
            interactive-xiaozhi-ai-app-android-configured/artifacts/INSTALL.txt
          if-no-files-found: error
          retention-days: 30
